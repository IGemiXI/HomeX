# ======================================================================
#  DummyGeraete – Test-Geräte ohne echte Hardware
#  Jeder Schaltvorgang erscheint in der HomeX-Konsole mit OK oder FEHLER.
#  Ideal, um Dashboard, Szenen und Regeln auszuprobieren, bevor die
#  echten Geräte angebunden sind.
# ======================================================================

# Geräte – eins pro Zeile, Reihenfolge bleibt erhalten:
#   geraet.<id> = <typ>, <Name>, <Raum>
# Typen: licht | dimmer | steckdose | rollladen
# Die <id> nur aus a-z, 0-9 und - (keine Umlaute), sie muss in HomeX eindeutig sein.
geraet.licht-wohnzimmer = licht, Deckenlicht, Wohnzimmer
geraet.stehlampe-wohnzimmer = dimmer, Stehlampe, Wohnzimmer
geraet.rollladen-wohnzimmer = rollladen, Rollladen, Wohnzimmer
geraet.licht-kueche = licht, Deckenlicht, Küche
geraet.steckdose-kaffee = steckdose, Kaffeemaschine, Küche
geraet.licht-schlafzimmer = dimmer, Nachttischlampe, Schlafzimmer
geraet.rollladen-schlafzimmer = rollladen, Rollladen, Schlafzimmer
geraet.licht-flur = licht, Flurlicht, Flur
geraet.licht-aussen = licht, Außenlicht, Garten

# So lange "braucht" ein Gerät für eine Antwort (Millisekunden).
verzoegerung-ms=200

# So viel Prozent der Befehle schlagen absichtlich fehl – zum Testen,
# wie Dashboard und Regeln mit Fehlern umgehen. 0 = nie.
fehlerquote=0

# So schnell fährt ein Rollladen (Sekunden von ganz zu bis ganz offen).
rollladen-fahrzeit-s=12
