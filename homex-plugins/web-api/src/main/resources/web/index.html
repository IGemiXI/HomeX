<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HomeX</title>
  <meta name="description" content="HomeX – dein Smarthome">
  <meta name="theme-color" content="#060A1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="sprung" href="#inhalt">Zum Inhalt springen</a>

  <div class="app">
    <!-- Navigation: links auf großen Bildschirmen, unten auf dem Handy -->
    <nav class="nav" aria-label="Hauptnavigation">
      <a class="marke" href="#/" aria-label="HomeX Übersicht">
        <svg class="marke-hex" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="markeNeon" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3DB2FF"/>
              <stop offset=".45" stop-color="#9D72FF"/>
              <stop offset=".75" stop-color="#FF4FB0"/>
              <stop offset="1" stop-color="#FFA24A"/>
            </linearGradient>
            <linearGradient id="markeMetall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2A3566"/>
              <stop offset=".5" stop-color="#141B3D"/>
              <stop offset="1" stop-color="#222C58"/>
            </linearGradient>
          </defs>
          <path d="M24 3 42 13.5v21L24 45 6 34.5v-21Z" fill="url(#markeMetall)" stroke="url(#markeNeon)" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M17.5 16.5 30.5 31.5M30.5 16.5 17.5 31.5" stroke="url(#markeNeon)" stroke-width="3.2" stroke-linecap="round"/>
        </svg>
        <span>HomeX</span>
      </a>
      <ul id="nav-liste" class="nav-liste"></ul>
      <p id="nav-status" class="nav-status" data-zustand="start" role="status">Verbinde …</p>
    </nav>

    <main id="inhalt" class="inhalt" tabindex="-1">
      <div id="seite"></div>
    </main>
  </div>

  <!-- Detailansicht eines Geräts -->
  <dialog id="blatt" class="blatt" aria-labelledby="blatt-titel">
    <div class="blatt-griff" aria-hidden="true"></div>
    <header class="blatt-kopf">
      <div id="blatt-symbol" class="blatt-symbol" aria-hidden="true"></div>
      <div>
        <h2 id="blatt-titel"></h2>
        <p id="blatt-unter"></p>
      </div>
      <button id="blatt-zu" class="rund-knopf" type="button" aria-label="Schließen"></button>
    </header>
    <div id="blatt-inhalt" class="blatt-inhalt"></div>
    <footer id="blatt-fuss" class="blatt-fuss"></footer>
  </dialog>

  <!-- Anmeldung -->
  <dialog id="login" class="login" aria-labelledby="login-titel">
    <form id="login-form" method="dialog">
      <svg class="login-hex" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 3 42 13.5v21L24 45 6 34.5v-21Z" fill="none" stroke="url(#markeNeon)" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M17.5 16.5 30.5 31.5M30.5 16.5 17.5 31.5" stroke="url(#markeNeon)" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <h2 id="login-titel">Bei HomeX anmelden</h2>
      <p>Den Zugangsschlüssel zeigt HomeX beim Start in der Konsole. Er steht auch in
        <code>plugins/WebAPI/config.properties</code> unter <code>token</code>.</p>
      <label for="token">Zugangsschlüssel</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required spellcheck="false">
      <p id="login-fehler" class="fehler" role="alert" hidden></p>
      <button class="knopf haupt" type="submit">Anmelden</button>
    </form>
  </dialog>

  <div id="meldung" class="meldung" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
