# ======================================================================
#  WebAPI – Konfiguration
# ======================================================================

# Port und Adresse des Webservers. 0.0.0.0 = im ganzen Heimnetz erreichbar,
# 127.0.0.1 = nur auf diesem Rechner.
port=8080
adresse=0.0.0.0

# Zugangsschlüssel für API und Dashboard. Bleibt er leer, erzeugt HomeX beim
# ersten Start einen zufälligen Schlüssel, trägt ihn hier ein und zeigt ihn im Log.
token=

# Von welchen Webseiten aus die API im Browser genutzt werden darf (CORS).
# Für das eingebaute Dashboard egal. Mehrere mit Komma, * = alle.
cors.erlaubt=*

# Das Dashboard unter http://<adresse>:<port>/ ausliefern?
dashboard=true
