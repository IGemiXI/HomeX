# ======================================================================
#  Wetter – Daten von Open-Meteo (https://open-meteo.com)
#  Kostenlos für private Nutzung, keine Anmeldung nötig.
#  Der Standort kommt aus der homex.properties (standort.breitengrad /
#  standort.laengengrad) – ohne Standort wartet das Plugin einfach.
# ======================================================================

# Wie oft das Wetter abgefragt wird (Minuten). Open-Meteo aktualisiert
# etwa alle 15 Minuten – öfter bringt nichts.
intervall-min=15

# Leistung deiner Solaranlage in kWp (steht im Angebot/Datenblatt).
# Damit schätzt HomeX den PV-Ertrag für heute und morgen grob ab.
# Leer = keine Schätzung, nur die Sonnenenergie pro m².
anlage.kwp=

# Adresse der Wetter-API – nur ändern, wenn Open-Meteo umzieht
api.url=https://api.open-meteo.com/v1/forecast
