# ======================================================================
#  HisenseKlima – Konfiguration
# ======================================================================

# Adresse des "ConnectLife API Connector" (läuft z. B. als Docker-Container
# auf dem Heimserver, siehe homex-plugins/hisense-klima/README.md)
bridge.url=http://192.168.178.10:8000

# Wie oft der Zustand abgefragt wird (Sekunden). Nicht zu oft – dahinter
# steckt die Hisense-Cloud. 30 s sind ein guter Wert.
intervall=30

# Timeout für jede Anfrage an die Bridge (Millisekunden)
timeout-ms=10000

# Geräte werden automatisch erkannt. Die HomeX-ID entsteht aus dem Namen in der
# ConnectLife-App, z. B. "Schlafzimmer" -> klima-schlafzimmer.
# Eigene ID oder eigenen Namen vergeben (puid steht in 'klima liste'):
#   id.pu1234567890=klima-buero
#   name.pu1234567890=Klima Büro
#   raum.pu1234567890=Büro      (Raum im Dashboard; Standard = Name aus der App)

# Erlaubter Temperaturbereich (°C)
temp.min=16
temp.max=30
