# ======================================================================
#  SmaSolar – Konfiguration
# ======================================================================

# Woher kommen die Daten?  modbus = lokal im Heimnetz (empfohlen)
#                          cloud  = SMA Monitoring API (smaapis.de)
# Solange Zugangsdaten bzw. Modbus fehlen, wartet das Plugin einfach –
# der Rest von HomeX läuft ganz normal. Umschalten geht jederzeit mit
# "sma quelle modbus" bzw. "sma quelle cloud" in der Konsole (ohne Neustart).
quelle=cloud

# Wie oft abfragen (Sekunden). Modbus: 5-10 s sind ok.
# Cloud: SMA hat ein Rate-Limit und die Daten sind 5-15 min alt -> mind. 300 s.
intervall.modbus=5
intervall.cloud=300

# ID, unter der der Wechselrichter in HomeX erscheint
geraet.id=solar
geraet.name=Solaranlage

# ----------------------------------------------------------------------
#  Modbus TCP (lokal)
#  Im Wechselrichter einmalig aktivieren: Login als Installateur ->
#  Geräteparameter -> Externe Kommunikation -> Modbus -> TCP-Server: Ein
# ----------------------------------------------------------------------
# Adresse des Wechselrichters. "auto" = HomeX sucht ihn selbst im Heimnetz
# (praktisch, wenn der Router keine festen IPs vergeben kann, z. B. Starlink).
# Feste IP oder Name geht auch, z. B. modbus.host=192.168.1.200
modbus.host=auto
# Nur bei "auto": in welchem Netz gesucht wird (leer = eigenes Netz automatisch),
# z. B. modbus.suchnetz=192.168.1 – mehrere mit Komma
modbus.suchnetz=
# Nur bei "auto": Seriennummer des Wechselrichters (steht auf dem Typenschild).
# Leer = der erste gefundene SMA-Wechselrichter wird genommen.
modbus.seriennummer=
modbus.port=502
modbus.unit-id=3
modbus.timeout-ms=3000

# ----------------------------------------------------------------------
#  SMA Cloud-API
#  Client-ID/Secret bekommst du vom SMA API Developer Support
#  (api-developer-support@sma.de). Danach in der HomeX-Konsole:
#    sma login        -> zeigt den Login-Link
#    sma code <code>  -> speichert den Refresh-Token hier automatisch
# ----------------------------------------------------------------------
cloud.sandbox=true
cloud.client-id=
cloud.client-secret=
cloud.redirect-uri=http://localhost/homex/sma
cloud.refresh-token=
# Anlagen-ID aus dem Sunny Portal (steht in der URL, wenn du die Anlage öffnest)
cloud.plant-id=

# Endpunkte – nur ändern, wenn SMA etwas umstellt
cloud.auth-url.prod=https://auth.smaapis.de/oauth2/auth
cloud.token-url.prod=https://auth.smaapis.de/oauth2/token
cloud.api-url.prod=https://monitoring.smaapis.de
cloud.auth-url.sandbox=https://sandbox-auth.smaapis.de/oauth2/auth
cloud.token-url.sandbox=https://sandbox-auth.smaapis.de/oauth2/token
cloud.api-url.sandbox=https://sandbox.smaapis.de/monitoring
# {plantId} wird ersetzt
cloud.messwerte-pfad=/v1/plants/{plantId}/measurements/sets/EnergyBalance/Recent
